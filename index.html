<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Obby Ragdoll</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      z-index: 10;
      transition: opacity 180ms ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.22);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .download-progress {
      width: min(260px, 68vw);
      text-align: center;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #fff;
      border-radius: inherit;
      transition: width 80ms linear;
    }

    .byte-count {
      margin-top: 9px;
      color: rgba(255, 255, 255, 0.72);
      font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading" aria-label="Loading">
    <div class="loading-inner">
      <div class="spinner"></div>
      <div class="download-progress">
        <div
          id="progress-track"
          class="progress-track"
          role="progressbar"
          aria-label="Game download progress"
          aria-valuemin="0"
          aria-valuemax="69410029"
          aria-valuenow="0"
        >
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="byte-count" class="byte-count">0 / 69,410,029 bytes</div>
      </div>
    </div>
  </div>

  <script src="Build/yandex-compat.js"></script>

  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progressTrack = document.getElementById('progress-track');
    const progressFill = document.getElementById('progress-fill');
    const byteCount = document.getElementById('byte-count');

    const buildUrl = 'Build';
    const loaderUrl = buildUrl + '/or.loader.js';

    const dataPartSizes = [4900000, 4900000, 4900000, 4484804];
    const codePartSizes = [
      4900000, 4900000, 4900000, 4900000, 4900000, 4900000,
      4900000, 4900000, 4900000, 4900000, 1225225
    ];
    const splitTotalBytes = [...dataPartSizes, ...codePartSizes]
      .reduce((sum, size) => sum + size, 0);

    function updateSplitDownloadProgress(loaded, total) {
      const safeTotal = total || splitTotalBytes;
      const safeLoaded = Math.min(loaded, safeTotal);
      const percent = safeTotal > 0 ? (safeLoaded / safeTotal) * 100 : 0;

      progressFill.style.width = percent.toFixed(3) + '%';
      progressTrack.setAttribute('aria-valuemax', String(safeTotal));
      progressTrack.setAttribute('aria-valuenow', String(safeLoaded));
      byteCount.textContent =
        safeLoaded.toLocaleString('en-US') + ' / ' +
        safeTotal.toLocaleString('en-US') + ' bytes';
    }

    const config = {
      dataParts: [
        'Build/or.data.part00',
        'Build/or.data.part01',
        'Build/or.data.part02',
        'Build/or.data.part03'
      ],
      dataPartSizes,
      frameworkUrl: buildUrl + '/or.framework.js',
      codeParts: [
        'Build/or.wasm.part00',
        'Build/or.wasm.part01',
        'Build/or.wasm.part02',
        'Build/or.wasm.part03',
        'Build/or.wasm.part04',
        'Build/or.wasm.part05',
        'Build/or.wasm.part06',
        'Build/or.wasm.part07',
        'Build/or.wasm.part08',
        'Build/or.wasm.part09',
        'Build/or.wasm.part10'
      ],
      codePartSizes,
      splitTotalBytes,
      onSplitDownloadProgress: updateSplitDownloadProgress,
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Unity',
      productName: 'Obby Ragdoll',
      productVersion: '1.0'
    };

    function hideLoading() {
      loading.classList.add('hidden');
      setTimeout(() => loading.remove(), 200);
    }

    const script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config)
        .then(instance => {
          window.unityInstance = instance;
          if (typeof SetYandexCompatUnityInstance === 'function') SetYandexCompatUnityInstance(instance);
          hideLoading();
        })
        .catch(error => {
          console.error('Unity failed to start:', error);
          byteCount.textContent = 'Load failed';
        });
    };
    script.onerror = error => {
      console.error('Failed to load Unity loader:', error);
      byteCount.textContent = 'Load failed';
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
