<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Obby Ragdoll</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      z-index: 10;
      transition: opacity 180ms ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.22);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading" aria-label="Loading">
    <div class="spinner"></div>
  </div>

  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');

    const buildUrl = 'Build';
    const loaderUrl = buildUrl + '/or.loader.js';

    const config = {
      dataParts: [
        'Build/or.data.part00',
        'Build/or.data.part01',
        'Build/or.data.part02',
        'Build/or.data.part03'
      ],
      frameworkUrl: buildUrl + '/or.framework.js',
      codeParts: [
        'Build/or.wasm.part00',
        'Build/or.wasm.part01',
        'Build/or.wasm.part02',
        'Build/or.wasm.part03',
        'Build/or.wasm.part04',
        'Build/or.wasm.part05',
        'Build/or.wasm.part06',
        'Build/or.wasm.part07',
        'Build/or.wasm.part08',
        'Build/or.wasm.part09',
        'Build/or.wasm.part10'
      ],
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Unity',
      productName: 'Obby Ragdoll',
      productVersion: '1.0'
    };

    function hideLoading() {
      loading.classList.add('hidden');
      setTimeout(() => loading.remove(), 200);
    }

    const script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config)
        .then(instance => {
          window.unityInstance = instance;
          hideLoading();
        })
        .catch(error => {
          console.error('Unity failed to start:', error);
        });
    };
    script.onerror = error => {
      console.error('Failed to load Unity loader:', error);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
