<script>
;(function () {
  'use strict';

  const TAG = '[unity-parts]';

  function assert(condition, message) {
    if (!condition) throw new Error(TAG + ' ' + message);
  }

  function partUrls(baseUrl, count) {
    assert(Number.isInteger(count) && count > 0, 'part count must be a positive integer');
    return Array.from({length: count}, (_, index) =>
      baseUrl + '.part' + String(index).padStart(2, '0')
    );
  }

  // Download an already-decompressed binary part; no Brotli, gzip, or other
  // application-level decompression is performed.
  async function fetchPart(url, onProgress, signal) {
    const response = await fetch(url, {cache: 'default', signal});
    if (!response.ok) {
      throw new Error(TAG + ' HTTP ' + response.status + ' while downloading ' + url);
    }

    const expected = Number(response.headers.get('Content-Length')) || 0;
    if (!response.body || typeof response.body.getReader !== 'function') {
      const bytes = new Uint8Array(await response.arrayBuffer());
      onProgress(bytes.byteLength, bytes.byteLength);
      return bytes;
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      if (value && value.byteLength) {
        chunks.push(value);
        received += value.byteLength;
        onProgress(received, expected);
      }
    }

    const bytes = new Uint8Array(received);
    let offset = 0;
    for (const chunk of chunks) {
      bytes.set(chunk, offset);
      offset += chunk.byteLength;
    }
    onProgress(received, received);
    return bytes;
  }

  function progressReporter(fetchShare, onProgress) {
    let previous = 0;
    return {
      loading(fraction) {
        const next = fetchShare * Math.min(1, Math.max(0, fraction));
        if (next > previous) {
          previous = next;
          if (onProgress) onProgress(next);
        }
      },
      unity(fraction) {
        const next = fetchShare + (1 - fetchShare) * Math.min(1, Math.max(0, fraction));
        if (next > previous) {
          previous = next;
          if (onProgress) onProgress(next);
        }
      }
    };
  }

  // Fetch in parallel (with a small concurrency limit), but retain each
  // part by its original index so completion order never affects the result.
  async function downloadParts(urls, progress) {
    const parts = new Array(urls.length);
    const fractional = new Array(urls.length).fill(0);
    const controller = new AbortController();
    let nextIndex = 0;

    function updateProgress() {
      progress.loading(fractional.reduce((sum, fraction) => sum + fraction, 0) / urls.length);
    }

    async function worker() {
      while (nextIndex < urls.length) {
        const index = nextIndex++;
        try {
          parts[index] = await fetchPart(urls[index], (loaded, total) => {
            // When Content-Length is missing, count the part when complete.
            fractional[index] = total ? Math.min(1, loaded / total) : 0;
            updateProgress();
          }, controller.signal);
          fractional[index] = 1;
          updateProgress();
        } catch (error) {
          controller.abort();
          throw error;
        }
      }
    }

    const concurrency = Math.min(4, urls.length);
    await Promise.all(Array.from({length: concurrency}, () => worker()));
    return parts;
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.async = true;
      script.onload = resolve;
      script.onerror = () => reject(new Error(TAG + ' could not load ' + src));
      document.body.appendChild(script);
    });
  }

  async function startUnityFromParts(canvas, config, onProgress) {
    assert(canvas instanceof HTMLCanvasElement, 'canvas is missing/invalid');
    assert(config && typeof config === 'object', 'config must be an object');
    assert(config.dataUrl && config.codeUrl && config.frameworkUrl && config.innerLoaderUrl,
      'dataUrl, codeUrl, frameworkUrl, and innerLoaderUrl are required');

    const wasmUrls = partUrls(config.codeUrl, config.codePartCount);
    const dataUrls = partUrls(config.dataUrl, config.dataPartCount);
    const progress = progressReporter(0.85, onProgress);
    const allParts = await downloadParts(wasmUrls.concat(dataUrls), progress);

    const wasmParts = allParts.slice(0, wasmUrls.length);
    const dataParts = allParts.slice(wasmUrls.length);

    // A Blob concatenates its parts in the given order without decompression.
    const wasmBlob = new Blob(wasmParts, {type: 'application/wasm'});
    const dataBlob = new Blob(dataParts, {type: 'application/octet-stream'});

    // Check the actual merged WASM file, not an individual part.
    const magic = new Uint8Array(await wasmBlob.slice(0, 4).arrayBuffer());
    if (magic.length !== 4 || magic[0] !== 0x00 || magic[1] !== 0x61 ||
        magic[2] !== 0x73 || magic[3] !== 0x6d) {
      throw new Error(TAG + ' merged WASM has an invalid header; check part order and file contents');
    }

    const wasmObjectUrl = URL.createObjectURL(wasmBlob);
    const dataObjectUrl = URL.createObjectURL(dataBlob);

    try {
      await loadScript(config.innerLoaderUrl);
      assert(typeof window.createUnityInstance === 'function',
        'inner Unity loader did not define createUnityInstance');

      // Do not pass this wrapper's own part-loading options into Unity.
      const {innerLoaderUrl, codePartCount, dataPartCount, ...unityConfig} = config;
      unityConfig.codeUrl = wasmObjectUrl;
      unityConfig.dataUrl = dataObjectUrl;

      const instance = await window.createUnityInstance(canvas, unityConfig, progress.unity);
      progress.unity(1);
      return instance;
    } finally {
      // Unity has already fetched/instantiated the merged assets by this point.
      URL.revokeObjectURL(wasmObjectUrl);
      URL.revokeObjectURL(dataObjectUrl);
    }
  }

  window.startUnityFromParts = startUnityFromParts;
})();
</script>
<script>
  const buildUrl  = "/Build";
  const config = {
    dataUrl:      buildUrl + "/or.data",  // .part00 through .part03
    dataPartCount: 4,
    frameworkUrl: buildUrl + "/or.framework.js",
    codeUrl:      buildUrl + "/or.wasm",  // .part00 through .part10
    codePartCount: 11,
    innerLoaderUrl: buildUrl + "/or.loader.js",
    streamingAssetsUrl: "StreamingAssets",
  };

  const container = document.querySelector("#unity-container");
  const canvas    = document.querySelector("#unity-canvas");
  const loadingCover     = document.querySelector("#loading-cover");
  const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
  const progressBarFull  = document.querySelector("#unity-progress-bar-full");
  const spinner = document.querySelector(".spinner");

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) container.className = "unity-mobile";
  loadingCover.style.display = "";
  document.addEventListener("contextmenu", e => e.preventDefault());
  function FocusGame(){ window.focus(); try{ canvas.focus(); }catch{} }
  window.addEventListener("pointerdown", FocusGame);
  window.addEventListener("touchstart",  FocusGame);

  let myGameInstance, StartUnityInstance;

  document.addEventListener('contextmenu', event => event.preventDefault());
  function FocusGame() {
      window.focus();
      canvas.focus();
  }
  window.addEventListener('pointerdown', () => { FocusGame(); });
  window.addEventListener('touchstart', () => { FocusGame(); });

  document.addEventListener('visibilitychange', function () {
      if (initGame == true) {
          if (document.hidden) {
              YG2Instance('SetFocusWindowGame', 'false');
          }
          else {
              YG2Instance('SetFocusWindowGame', 'true');
          }
      }
  });

  startUnityFromParts(canvas, config, (progress) => {
      spinner.style.display = "none";
      progressBarEmpty.style.display = "";
      const adjustedProgress = Math.max(progress, 0.05);
      progressBarFull.style.width = `${100 * adjustedProgress}%`;
  }).then((unityInstance) => {
      myGameInstance = unityInstance;
      loadingCover.style.display = "none";
      isGameLoaded = true;
  }).catch((error) => {
      console.error(error);
      spinner.style.display = 'none';
      progressBarEmpty.style.display = 'none';
      loadingCover.style.display = '';
      const notice = document.createElement('div');
      notice.style.cssText = 'position:absolute;bottom:10%;left:5%;right:5%;color:white;background:#842b2b;padding:12px;z-index:10;font:14px sans-serif;white-space:pre-wrap';
      notice.textContent = 'Game failed to load: ' + (error && error.message ? error.message : String(error));
      loadingCover.appendChild(notice);
  });

  var environmentData = 'no data';
  window.environmentData = environmentData;
  var reviewData = 'false';

  let cloudSaves   = 'no data';
  let paymentsData = 'no data';
  let playerData   = 'no data';
  let player = null, payments = null, initGame = false, nowFullAdOpen = false;
  let sdkReady = false;
  let _pendingSave = null;

  let lastAdTime = 0;
  function canShowAd(){ return Date.now() - lastAdTime > 30000; }

  function SaveCloud(jsonData, flush) {
    if (!player || !sdkReady) { 
      _pendingSave = { jsonData, flush };
      return;
    }
    try { 
      player.setData({ saves:[jsonData] }, flush); 
    } catch (e) {
      console.error('CRASH Save Cloud:', e);
    }
  }

  function LoadCloud() {
    return new Promise((resolve) => {
      try {
        if (!player) {
          cloudSaves = 'no data';
          sendYG('SetLoadSaves', 'no data');
          return resolve('no data');
        }
        player.getData(['saves']).then(data => {
          const res = (data && data.saves) ? JSON.stringify(data.saves) : 'no data';
          cloudSaves = res;
          sendYG('SetLoadSaves', res);
          resolve(res);
        }).catch(() => {
          cloudSaves = 'no data';
          sendYG('SetLoadSaves', 'no data');
          resolve('no data');
        });
      } catch {
        cloudSaves = 'no data';
        sendYG('SetLoadSaves', 'no data');
        resolve('no data');
      }
    });
  }

  function InitPayments(sendback){
    return new Promise((resolve)=>{
      try{
        const productID          = ['starter_pack', 'mega_pack'];
        const title              = ['Starter Pack',  'Mega Pack'];
        const description        = ['100k coins + 1.5k crystals', '250k coins + 5k crystals'];
        const imageURI           = ['', ''];
        const price              = ['0.00', '0.00'];
        const priceValue         = [0, 0];
        const priceCurrencyCode  = ['USD','USD'];
        const currencyImageURL   = ['', ''];
        const consumed           = [true, true];

        const jsonPayments = {
          id: productID,
          title,
          description,
          imageURI,
          price,
          priceValue,
          priceCurrencyCode,
          currencyImageURL,
          consumed,
          language: 'en'
        };

        paymentsData = JSON.stringify(jsonPayments);
        sendYG('PaymentsEntries', paymentsData);
        resolve(paymentsData);
      }catch(e){
        paymentsData = 'no data';
        sendYG('PaymentsEntries', 'no data');
        resolve(paymentsData);
      }
    });
  }

  function FullAdShow() {
    if (!canShowAd()) { sendYG('CloseInterAdv', 'false'); return; }

    try {
      if (nowFullAdOpen) return;
      nowFullAdOpen = true;
      lastAdTime = Date.now();

      sendYG('OpenInterAdv');

      if (typeof sdk !== 'undefined' && typeof sdk.showBanner === 'function') {
        sdk.showBanner();
        setTimeout(function () {
          nowFullAdOpen = false;
          sendYG('CloseInterAdv', 'true');
          FocusGame();
        }, 3000);
      } else {
        nowFullAdOpen = false;
        sendYG('CloseInterAdv', 'false');
        FocusGame();
      }
    } catch (e) {
      nowFullAdOpen = false;
      sendYG('ErrorInterAdv'); 
      sendYG('CloseInterAdv', 'false');
      FocusGame();
    }
  }

  function RewardedShow(id) {
    if (!canShowAd()) {
      sendYG('RewardUnavailable');
      sendYG('CloseRewardedAdv');
      return;
    }

    try {
      lastAdTime = Date.now();
      sendYG('OpenRewardedAdv'); 

      if (typeof sdk !== 'undefined' && typeof sdk.showBanner === 'function') {
        sdk.showBanner();
        setTimeout(function () {
          sendYG('RewardAdv', id);
          sendYG('CloseRewardedAdv', 'true');
          FocusGame();
        }, 3000);
      } else {
        sendYG('RewardAdv', id);
        sendYG('CloseRewardedAdv', 'true');
        FocusGame();
      }
    } catch (e) {
      sendYG('ErrorRewardedAdv');
      sendYG('CloseRewardedAdv', 'false');
      FocusGame();
    }
  }
  function StickyAdActivity(show) {}

  const FORCED_LANG = 'en';
  try {
    Object.defineProperty(navigator, 'language',  { get: () => 'en-US', configurable: true });
    Object.defineProperty(navigator, 'languages', { get: () => ['en-US','en'], configurable: true });
  } catch(e){
    try { navigator.__defineGetter__('language',  ()=>'en-US'); } catch{}
    try { navigator.__defineGetter__('languages', ()=>['en-US','en']); } catch{}
  }
  try { document.documentElement.lang = 'en'; } catch{}

  window.YaGames = {
    init: () => Promise.resolve((function(){
      const isM = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const obj = {
        environment: { i18n:{ lang:FORCED_LANG, tld:'com' }, app:{ id:'stub.app.id' }, browser:{ lang:FORCED_LANG }, payload:null },
        deviceInfo:  { type:isM?'mobile':'desktop', isMobile:()=>isM, isDesktop:()=>!isM, isTablet:()=>/iPad|Tablet/i.test(navigator.userAgent), isTV:()=>false },
        screen:      { fullscreen:{ status:'off', request(){ this.status='on'; } } },
        adv: {
          showFullscreenAdv({callbacks}={}){
            try{ callbacks?.onOpen?.(); }catch{}
            try{ InterAdvShow(); }catch{}
            setTimeout(()=>{ try{ callbacks?.onClose?.(true); }catch{} },300);
          },
          showRewardedVideo({callbacks}={}){
            try{ callbacks?.onOpen?.(); }catch{}
            setTimeout(()=>{ try{ callbacks?.onRewarded?.(); callbacks?.onClose?.(); }catch{} },300);
          }
        },
        features: { LoadingAPI: { ready(){   } } },
        serverTime: () => Date.now(),
        feedback: {
          canReview:     () => Promise.resolve({ value:false }),
          requestReview: () => Promise.resolve({ feedbackSent:false })
        },
        auth: { openAuthDialog: () => Promise.resolve() },
        getPlayer: () => Promise.resolve((() => {
          const APP_KEY = 'yg2_cloud_' + (location.host + location.pathname);
          let cache;
          try { cache = JSON.parse(localStorage.getItem(APP_KEY) || '{}'); } catch { cache = {}; }
          function persist(){ try { localStorage.setItem(APP_KEY, JSON.stringify(cache)); } catch {} }

          return {
            isAuthorized:   () => true,
            getMode:        () => 'full',
            getName:        () => 'Guest',
            getPhoto:       () => '',
            getUniqueID:    () => 'guest_' + (location.host || 'local'),
            getPayingStatus:() => 'unknown',

            setData: (obj, flush) => {
              if (obj && typeof obj === 'object') {
                cache = { ...cache, ...obj };
                if (flush !== false) persist();
              }
            },
            getData: (keys) => Promise.resolve(
              Array.isArray(keys) && keys.length
                ? keys.reduce((acc,k)=>{ acc[k]=cache[k]; return acc; }, {})
                : { ...cache }
            )
          };
        })()),
        getPayments:     () => Promise.reject(new Error('payments-unavailable')),
        getLeaderboards: () => Promise.reject(new Error('leaderboards-unavailable')),
      };
      window.ysdk = obj; 
      return obj;
    })())
  };

  (async () => { 
    try { 
      await window.YaGames.init(); 
      sdkReady = true;
      await InitPlayer();
      await LoadCloud();

      if (_pendingSave && player) {
        try { player.setData({ saves:[_pendingSave.jsonData] }, !!_pendingSave.flush); } catch {}
        _pendingSave = null;
      }
    } catch (e) {
      console.warn('bootstrap init failed', e);
    } 
  })();

  function sendYG(method, arg){
    try{ arg===undefined ? myGameInstance?.SendMessage('YG2Instance', method)
                         : myGameInstance?.SendMessage('YG2Instance', method, String(arg)); }catch{}
    try{ arg===undefined ? myGameInstance?.SendMessage('YandexGame', method)
                         : myGameInstance?.SendMessage('YandexGame', method, String(arg)); }catch{}
  }
  function LogStyledMessage(msg, style){ try{ console.log('%c'+(msg??''), style||'color:#FFDF73;background:#454545'); }catch{ console.log(msg); } }

  function RequestingEnvironmentData(){
    const isM = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const json = JSON.stringify({
      language: FORCED_LANG, domain:'com',
      deviceType: isM?'mobile':'desktop',
      isMobile:isM, isDesktop:!isM, isTablet:/iPad|Tablet/i.test(navigator.userAgent), isTV:false,
      appID:'stub.app.id', browserLang:FORCED_LANG, payload:null, platform:navigator.platform, browser:'Other'
    });
    environmentData = json;
    window.environmentData = json;
    sendYG('SetEnvirData', json);
  }

  async function InitPlayer(){
    try{
      const p = await ysdk.getPlayer();
      player = p;

      if (_pendingSave) {
        try { player.setData({ saves:[_pendingSave.jsonData] }, !!_pendingSave.flush); } catch {}
        _pendingSave = null;
      }

      const authJson = {
        playerAuth:'resolved',
        playerName:p.getName(),
        playerId:p.getUniqueID(),
        playerPhoto:p.getPhoto('medium') || 'null',
        payingStatus:p.getPayingStatus()
      };
      const data = JSON.stringify(authJson);
      playerData = data;
      sendYG('SetAuth', data);
    }catch{
      const data = JSON.stringify({
        playerAuth:'rejected', playerName:'unauthorized',
        playerId:'unauthorized', playerPhoto:'null', payingStatus:'unknown'
      });
      playerData = data;
      sendYG('SetAuth', data);
    }
  }

  function flasgsData() {}
  function YG2Instance(method, arg){ sendYG(method, arg); }
  function Payments() {}
  function BuyPayments(id) {
    try {
      if (payments != null) {
        payments.purchase(id).then(() => {
          LogStyledMessage('Purchase Success');
          ConsumePurchase(id, true);
          FocusGame();
        }).catch(e => {
          console.error('Purchase Failed', e.message);
          YG2Instance('OnPurchaseFailed', id);
          FocusGame();
        })
      }
      else {
        LogStyledMessage('Payments == null');
        sendYG('OnPurchaseFailed', id);
      }
    } catch (e) {
      console.error('CRASH Buy Payments: ', e.message);
      YG2Instance('OnPurchaseFailed', id);
      FocusGame();
    }
  }
  function InterAdvShow(){ try{ FullAdShow(); }catch{} }
  function RewardedAdvShow(id){ try{ RewardedShow(id); }catch{} }
  function InitReview(){ reviewData = 'false'; }
  function Review(){}

  function SetLeaderboard(name, score, extraData) {
    try {
      const key = 'lb_' + String(name || 'default');
      const val = Number(score) || 0;

      let best = 0;
      try { best = Number(localStorage.getItem(key) || '0'); } catch {}
      if (val > best) {
        try { localStorage.setItem(key, String(val)); } catch {}
      }
    } catch {}
  }

  function GetLeaderboard(nameLB, quantityTop, quantityAround, photoSize, auth) {
    try {
      const payload = {
        technoName: String(nameLB || ''),
        isDefault: false,
        isInvertSortOrder: false,
        decimalOffset: 0,
        type: 'numeric',
        entries: 'no data',
        ranks: [],
        photos: [],
        names: [],
        scores: [],
        uniqueIDs: [],
        extraDataArray: []
      };

      sendYG('LeaderboardEntries', JSON.stringify(payload));
    } catch {}
  }
  
  window._InitEnvironmentData_js = function(){ try{ RequestingEnvironmentData(); }catch{} };
  window._InitPlayer_js          = function(){ try{ InitPlayer(); }catch{} };
  window._LoadCloud_js           = function(){ try{ LoadCloud(); }catch{} };
  window._InterAdvShow_js        = function(){ try{ InterAdvShow(); }catch{} };
  window._RewardedAdvShow_js     = function(id){ try{ RewardedAdvShow(id); }catch{} };
  window._OpenAuthDialog_js      = function(){ try{ OpenAuthDialog(); }catch{} };
  window._InitPayments_js = function () {
    try {
      paymentsData = 'no data';
      sendYG('PaymentsEntries', 'no data');
    } catch {}
  };

  function GetPayments(){ console.warn("GetPayments is not implemented"); return Promise.resolve("no data"); }
  function GetLeaderboardScores() {}
  function ConsumePurchases() {   }
  function OpenAuthDialog(){ if(myGameInstance){ myGameInstance.SendMessage('YandexGame','GetDataInvoke'); } }
  function InitGame(){ initGame=true; if(nowFullAdOpen) myGameInstance?.SendMessage('YandexGame','OpenFullAd'); }
  function GameReadyAPI(){}
</script>
